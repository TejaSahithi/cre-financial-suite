# Internal background worker — called by ingest-file using the service role key.
# verify_jwt=false because Supabase's platform JWT check rejects service-role
# Bearer tokens issued from within another edge function; auth is handled
# internally via WORKER_INTERNAL_SECRET / SUPABASE_SERVICE_ROLE_KEY check.
[functions.lease-extraction-worker]
enabled = true
verify_jwt = false

[functions.parse-file]
enabled = true
verify_jwt = true

# verify_jwt=false: parse-pdf-docling is called from both the browser (via
# ingest-file, user JWT) and from lease-extraction-worker (service-role key).
# Supabase's platform JWT check rejects the service-role Bearer in verify_jwt=true
# mode, so auth is handled entirely inside the function via verifyUser() which
# already short-circuits on x-internal-service-key == SUPABASE_SERVICE_ROLE_KEY.
[functions.parse-pdf-docling]
enabled = true
verify_jwt = false

# verify_jwt=false: normalize-pdf-output is called both by browsers (via
# ingest-file with user JWT) and from lease-extraction-worker (service-role
# key). Supabase's platform JWT check rejects service-role Bearer when
# verify_jwt=true; auth is handled inside via verifyUser() which
# short-circuits on x-internal-service-key == SUPABASE_SERVICE_ROLE_KEY.
[functions.normalize-pdf-output]
enabled = true
verify_jwt = false

