# Browser OPTIONS preflights do not carry Authorization, so the Supabase
# gateway must let the function answer CORS. The handler still authenticates
# every POST via resolveAssistantContext/verifyUser before reading or writing
# assistant conversation data or executing any business-data tool.
verify_jwt = false
